services:
  wifi-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: susesi-wifi-helper
    restart: unless-stopped
    ports:
      - "${BIND_IP:-10.1.11.126}:${PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - MIKROTIK_LOGIN_URL=${MIKROTIK_LOGIN_URL:-http://10.1.3.1/login}
      - MIKROTIK_PROBE_URL=${MIKROTIK_PROBE_URL:-http://10.1.3.1/login}
      - PROBE_TIMEOUT_SECONDS=${PROBE_TIMEOUT_SECONDS:-1.5}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
